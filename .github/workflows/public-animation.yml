name: Public Safari motion proof
on:
  pull_request:
    paths: ['public/**', 'tests/**', '.github/workflows/public-animation.yml']
  push:
    branches: [main]
    paths: ['public/**', 'tests/**', '.github/workflows/public-animation.yml']
permissions:
  contents: read
jobs:
  public-motion:
    name: ${{ matrix.browser }} / ${{ matrix.motion }} / full duration
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        motion: [no-preference, reduce]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: PR code - manual picks, full real-time motion, rendered frames and final results
        if: github.event_name == 'pull_request'
        env:
          MOTION_BROWSER: ${{ matrix.browser }}
          MOTION_PREF: ${{ matrix.motion }}
        run: python tests/public_animation_test.py
      - name: Actual public root URL - verify deployed hashes and the complete interaction
        if: github.event_name == 'push'
        env:
          LUCKY_PUBLIC_URL: https://lucky1.itisnowornever271.workers.dev/
          MOTION_BROWSER: ${{ matrix.browser }}
          MOTION_PREF: ${{ matrix.motion }}
        run: python tests/public_animation_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucky-full-motion-${{ matrix.browser }}-${{ matrix.motion }}
          path: public-animation-results/
          retention-days: 7
