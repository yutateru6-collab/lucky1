name: Deploy lucky1 preview to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify app
        run: |
          npm run check
          npm run build

      - name: Deploy temporary build to Cloudflare without API token
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --temporary > cloudflare-deploy.txt 2>&1
          grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' cloudflare-deploy.txt | head -n 1 > public-url.txt || true
          test -s public-url.txt || (echo 'Cloudflare public URL was not detected' && exit 1)
          echo "Cloudflare temporary URL: $(cat public-url.txt)"

      - name: Save claim information briefly
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-temporary-deploy-output
          path: |
            cloudflare-deploy.txt
            public-url.txt
          retention-days: 1
