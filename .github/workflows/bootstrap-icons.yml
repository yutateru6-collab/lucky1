name: Initialize PWA icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-icons.yml']
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2
          python -m pip install CairoSVG==2.8.2
      - name: Restore PNG icons from the original SVG
        run: python scripts/generate-icons.py
      - run: npm run check
      - run: npm run build
      - name: Commit only generated PWA icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/icons/apple-touch-icon.png public/icons/icon-192.png public/icons/icon-512.png public/icons/maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add original PWA icons generated from SVG'
            git push origin HEAD:main
          fi
