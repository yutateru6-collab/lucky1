name: Lucky reference visual QA
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/reference-qa.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/reference-qa.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot review source (no credentials or private data)
        uses: actions/upload-artifact@v4
        with:
          name: lucky-review-source
          path: |
            public/
            scripts/
            tests/
            docs/
            AGENTS.md
            README.md
            package.json
            wrangler.jsonc
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Japanese browser fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Existing interaction and offline regression tests
        env:
          LUCKY_HTTP: '1'
        run: python tests/ui_offline_test.py
      - name: Reference layout screenshots and assertions
        run: |
          if [ -f tests/reference_visual.py ]; then
            python tests/reference_visual.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucky-reference-screenshots
          path: test-results/
          retention-days: 7
