name: lucky checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser flows, storage and offline app
        env:
          LUCKY_HTTP: '1'
        run: python tests/ui_offline_test.py
      - name: Quick choice keeps the approved home and saves only after result
        run: python tests/quick_mode_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucky-v3-ui-tests
          path: test-results/
          retention-days: 7
  verify-deployment:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify real deployed v3 files (does not deploy)
        run: node scripts/verify-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucky-v3-live-verification
          path: live-verification.json
          retention-days: 7
