name: lucky checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser flows, privacy, migration and real offline app
        env:
          LUCKY_HTTP: '1'
        run: python tests/ui_offline_test.py
      - name: Verify exact deployed bytes (does not deploy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/verify-live.mjs
      - name: Exercise the actual public app and capture screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tests/verify_public_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucky-v4-verification
          path: |
            test-results/
            live-results/
            live-verification.json
          retention-days: 7
