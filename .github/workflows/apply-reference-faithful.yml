name: Apply reference-faithful lucky UI

on:
  push:
    branches: [design/reference-faithful]
    paths: [reference-bundle.ready]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/reference-faithful
      - name: Apply bundle
        run: |
          set -euo pipefail
          cat reference-bundle.part* | base64 -d > reference-faithful-bundle.zip
          unzip -o reference-faithful-bundle.zip
          rm reference-faithful-bundle.zip reference-bundle.part* reference-bundle.ready
          rm .github/workflows/apply-reference-faithful.yml
          npm run check
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match lucky UI to approved reference"
          git push origin HEAD:design/reference-faithful
