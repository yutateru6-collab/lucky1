name: Coin start diagnosis (no deployment)
on:
  push:
    branches: [fix/coin-start-both-flows-410]
    paths: [.github/workflows/coin-start-diagnosis.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps webkit
      - name: Reproduce both public flows without changing user data
        run: |
          mkdir -p diagnosis
          git archive HEAD -o diagnosis/source.tar
          python - <<'PY'
          import json, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('diagnosis'); reports=[]
          URL='https://lucky1.itisnowornever271.workers.dev/'
          with sync_playwright() as p:
            browser=p.webkit.launch()
            for scenario in ['quick-normal','quick-asset-stall','quick-no-webgl','memo-reduce','memo-normal']:
              ctx=browser.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True,locale='ja-JP',reduced_motion='reduce' if 'reduce' in scenario else 'no-preference',record_video_dir=str(out/scenario),record_video_size={'width':390,'height':844},service_workers='block')
              page=ctx.new_page(); report={'scenario':scenario,'errors':[],'responses':[]}; reports.append(report)
              page.on('pageerror',lambda e:report['errors'].append(str(e)))
              page.on('response',lambda r:report['responses'].append({'status':r.status,'url':r.url}) if r.status>=400 else None)
              if scenario=='quick-asset-stall':
                async def hold(route):
                  import asyncio
                  await asyncio.sleep(24)
                  try: await route.abort()
                  except: pass
                page.route('**/*.glb',hold)
              if scenario=='quick-no-webgl':
                page.add_init_script("const g=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,...a){if(t.includes('webgl'))return null;return g.call(this,t,...a)}")
              try:
                page.goto(URL,wait_until='domcontentloaded'); page.locator('#quick-start-home').wait_for()
                if scenario.startswith('quick'):
                  page.locator('#quick-start-home').tap();page.locator('[data-quick-method="coin"]').tap();page.locator('[data-quick-pick="heads"]').tap();page.locator('#quick-draw').tap()
                  page.wait_for_timeout(1600)
                  report['at1_6s']={'stage':page.locator('#quick-animation-stage').is_visible(),'busy':page.locator('#quick-dialog').get_attribute('aria-busy'),'error':page.locator('#quick-error').inner_text(),'label':page.locator('#quick-animation-label').inner_text(),'canvasCount':page.locator('canvas').count()}
                  page.screenshot(path=str(out/(scenario+'-1.6s.png')))
                else:
                  page.locator('#home-start').tap();page.locator('#decision-note').fill('試してみたかった店に入る');page.locator('#memo-next').tap();page.locator('#mood-skip').tap();page.locator('#flow-methods [data-method="coin"]').tap();page.locator('#method-next').tap()
                  page.locator('#game-controls .primary-button').tap();page.wait_for_timeout(250)
                  report['at250ms']={'stage':page.locator('#game-view').is_visible(),'result':page.locator('#result-view').is_visible(),'animationCount':page.evaluate('document.getAnimations().filter(a=>a.playState==="running").length')}
                  page.screenshot(path=str(out/(scenario+'-250ms.png')))
                report['observed']=True
              except Exception as e:report['exception']=str(e)
              finally:ctx.close();(out/'report.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
            browser.close()
          print(json.dumps(reports,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-start-baseline
          path: diagnosis/
          retention-days: 7
